
version: 2

models:
  - name: stg_customer
    description: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.CUSTOMER"
    columns:
      - name: customer_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.ORDERS"
    columns:
      - name: order_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: stg_nation
    description: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.NATION"
    columns:
      - name: nation_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: int_customer_orders
    description: "Order-level customer dataset joining staged customers, orders, and nations."
    columns:
      - name: order_id
        description: "Primary key for each order."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null

      - name: nation_name
        description: "Customer nation from staged nation data."
        data_tests:
          - not_null

      - name: total_price
        description: "Total order price."
        data_tests:
          - not_null

      - name: order_date
        description: "Date the order was placed."
        data_tests:
          - not_null